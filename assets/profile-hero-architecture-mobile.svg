<svg xmlns="http://www.w3.org/2000/svg" width="800" height="960" viewBox="0 0 800 960" role="img" aria-labelledby="title desc">
  <title id="title">Pushmitha Vigneswaran mobile engineering system map</title>
  <desc id="desc">A mobile layout connecting Pushmitha's Information Technology degree at the University of Moratuwa to Fixflow, a Next.js portfolio, a React and Spring Boot application, and a software engineering internship goal.</desc>

  <defs>
    <marker id="lavender-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#6C63B8"/>
    </marker>
    <clipPath id="mobile-frame">
      <rect x="2" y="2" width="796" height="956" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mobile-frame)">
    <rect width="800" height="960" fill="#FBF8F2"/>

    <!-- Personal identity -->
    <rect x="24" y="24" width="752" height="180" rx="20" fill="#FFFDF9" stroke="#DED8CE" stroke-width="2"/>
    <rect x="24" y="24" width="10" height="180" rx="5" fill="#6C63B8"/>
    <rect x="58" y="58" width="84" height="84" rx="20" fill="#1E2A3A"/>
    <text x="100" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="750" fill="#FFFDF9">PV</text>
    <circle cx="128" cy="71" r="5" fill="#F4C0AE"/>

    <g font-family="Inter, Arial, sans-serif">
      <text x="170" y="78" font-size="38" font-weight="780" fill="#1E2A3A">PUSHMITHA VIGNESWARAN</text>
      <text x="170" y="116" font-size="25" font-weight="700" fill="#6C63B8">BSc (Hons) Information Technology</text>
      <text x="170" y="151" font-size="24" fill="#667080">University of Moratuwa · Colombo, Sri Lanka</text>
      <text x="58" y="182" font-size="19" font-weight="700" letter-spacing="2" fill="#667080">FULL-STACK · BACKEND · INTERFACE TO INFRASTRUCTURE</text>
    </g>

    <!-- Project system -->
    <rect x="24" y="224" width="752" height="502" rx="20" fill="#FFFDF9" stroke="#DED8CE" stroke-width="2"/>
    <g font-family="Inter, Arial, sans-serif">
      <text x="54" y="267" font-size="20" font-weight="750" letter-spacing="2.3" fill="#667080">PERSONAL ENGINEERING SYSTEM</text>
      <text x="54" y="302" font-size="28" font-weight="740" fill="#1E2A3A">Three real projects across the full stack.</text>
    </g>

    <!-- Fixflow -->
    <rect x="46" y="326" width="708" height="182" rx="16" fill="#F8F6FF" stroke="#D8D2F5" stroke-width="2"/>
    <rect x="46" y="326" width="9" height="182" rx="4.5" fill="#6C63B8"/>
    <text x="76" y="366" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="780" fill="#1E2A3A">FIXFLOW</text>
    <text x="76" y="396" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#667080">maintenance operations · service architecture</text>

    <g font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1E2A3A">
      <g transform="translate(112 446)">
        <rect x="-53" y="-28" width="106" height="56" rx="10" fill="#FFFDF9" stroke="#6C63B8" stroke-width="2"/>
        <text y="7">React / TS</text>
      </g>
      <g transform="translate(251 446)">
        <rect x="-57" y="-28" width="114" height="56" rx="10" fill="#FFFDF9" stroke="#6C63B8" stroke-width="2"/>
        <text y="7">Gateway</text>
      </g>
      <g transform="translate(402 446)">
        <rect x="-65" y="-28" width="130" height="56" rx="10" fill="#FFFDF9" stroke="#6C63B8" stroke-width="2"/>
        <text y="7">Python / .NET</text>
      </g>
      <g transform="translate(558 446)">
        <rect x="-61" y="-28" width="122" height="56" rx="10" fill="#FFFDF9" stroke="#6C63B8" stroke-width="2"/>
        <text y="7">Kafka + SQL</text>
      </g>
      <g transform="translate(688 446)">
        <circle r="30" fill="#FFFDF9" stroke="#6C63B8" stroke-width="2"/>
        <path d="M-14 0L-4 11L16-13" fill="none" stroke="#4E7D66" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text y="52">Tests</text>
      </g>
    </g>
    <g fill="none" stroke="#6C63B8" stroke-width="2.5" marker-end="url(#lavender-arrow)">
      <line x1="167" y1="446" x2="184" y2="446"/>
      <line x1="310" y1="446" x2="327" y2="446"/>
      <line x1="469" y1="446" x2="487" y2="446"/>
      <line x1="621" y1="446" x2="648" y2="446"/>
    </g>

    <!-- Portfolio -->
    <rect x="46" y="526" width="708" height="82" rx="16" fill="#F3F8F4" stroke="#CFE1D4" stroke-width="2"/>
    <rect x="46" y="526" width="9" height="82" rx="4.5" fill="#4E7D66"/>
    <g font-family="Inter, Arial, sans-serif" fill="#1E2A3A">
      <text x="76" y="561" font-size="27" font-weight="780">PORTFOLIO</text>
      <text x="76" y="590" font-size="18" fill="#667080">interactive portfolio</text>
      <text x="280" y="573" font-size="21" font-weight="700">Next.js / TS</text>
      <text x="435" y="573" font-size="22" font-weight="700" fill="#4E7D66">→</text>
      <text x="478" y="573" font-size="21" font-weight="700">Accessible UI</text>
      <text x="625" y="573" font-size="22" font-weight="700" fill="#4E7D66">→ Vercel</text>
    </g>

    <!-- E-commerce -->
    <rect x="46" y="626" width="708" height="78" rx="16" fill="#FFF5F1" stroke="#EDC8BA" stroke-width="2"/>
    <rect x="46" y="626" width="9" height="78" rx="4.5" fill="#D98268"/>
    <g font-family="Inter, Arial, sans-serif" fill="#1E2A3A">
      <text x="76" y="675" font-size="27" font-weight="780">E-COMMERCE</text>
      <text x="294" y="675" font-size="21" font-weight="700">React</text>
      <text x="364" y="675" font-size="22" font-weight="700" fill="#D98268">→</text>
      <text x="407" y="675" font-size="21" font-weight="700">Spring Boot REST</text>
      <text x="604" y="675" font-size="22" font-weight="700" fill="#D98268">→ H2</text>
    </g>

    <!-- Internship destination -->
    <rect x="24" y="748" width="752" height="188" rx="20" fill="#1E2A3A"/>
    <g font-family="Inter, Arial, sans-serif">
      <text x="58" y="792" font-size="18" font-weight="750" letter-spacing="2.2" fill="#F4C0AE">PROFESSIONAL DIRECTION</text>
      <text x="58" y="836" font-size="33" font-weight="780" fill="#FFFDF9">FULL-STACK + BACKEND</text>
      <rect x="464" y="782" width="278" height="70" rx="14" fill="#2A3749" stroke="#4A5668" stroke-width="2"/>
      <text x="490" y="811" font-size="17" font-weight="700" letter-spacing="1.4" fill="#D7E8DC">CURRENTLY OPEN TO</text>
      <text x="490" y="838" font-size="21" font-weight="740" fill="#FFFDF9">SOFTWARE INTERNSHIPS</text>
      <line x1="58" y1="870" x2="742" y2="870" stroke="#4A5668" stroke-width="2"/>
      <circle cx="67" cy="902" r="5" fill="#D98268"/>
      <text x="84" y="910" font-size="21" font-weight="650" fill="#FFFDF9">Building reliable, useful digital products.</text>
    </g>
  </g>

  <rect x="2" y="2" width="796" height="956" rx="28" fill="none" stroke="#DED8CE" stroke-width="4"/>
</svg>

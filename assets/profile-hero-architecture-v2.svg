      <line x1="758" y1="263" x2="790" y2="263"/>
      <line x1="928" y1="263" x2="948" y2="263"/>
      <line x1="1080" y1="263" x2="1095" y2="263"/>
    </g>

    <!-- PORTFOLIO lane -->
    <rect x="414" y="338" width="778" height="91" rx="16" fill="#F3F8F4" stroke="#CFE1D4" stroke-width="2"/>
    <rect x="414" y="338" width="9" height="91" rx="4.5" fill="#4E7D66"/>
    <g font-family="Inter, Arial, sans-serif" fill="#1E2A3A">
      <text x="448" y="375" font-size="26" font-weight="780">PORTFOLIO</text>
      <text x="448" y="402" font-size="17" font-weight="600" fill="#667080">interactive portfolio</text>
      <text x="680" y="377" font-size="21" font-weight="700">Next.js / TypeScript</text>
      <text x="916" y="377" font-size="21" font-weight="700">Accessible UI</text>
      <text x="1104" y="377" font-size="21" font-weight="700">Vercel</text>
      <text x="680" y="404" font-size="16" fill="#667080">responsive components</text>
      <text x="916" y="404" font-size="16" fill="#667080">reduced motion</text>
      <text x="1104" y="404" font-size="16" fill="#667080">deployment</text>
    </g>
    <g fill="none" stroke="#4E7D66" stroke-width="2.5" marker-end="url(#arrow-sage)">
      <line x1="848" y1="382" x2="886" y2="382"/>
      <line x1="1040" y1="382" x2="1074" y2="382"/>
    </g>

    <!-- E-COMMERCE lane -->
    <rect x="414" y="443" width="778" height="91" rx="16" fill="#FFF5F1" stroke="#EDC8BA" stroke-width="2"/>
    <rect x="414" y="443" width="9" height="91" rx="4.5" fill="#D98268"/>
    <g font-family="Inter, Arial, sans-serif" fill="#1E2A3A">
      <text x="448" y="480" font-size="26" font-weight="780">E-COMMERCE</text>
      <text x="448" y="507" font-size="17" font-weight="600" fill="#667080">full-stack learning project</text>
      <text x="680" y="482" font-size="21" font-weight="700">React</text>
      <text x="830" y="482" font-size="21" font-weight="700">Spring Boot REST</text>
      <text x="1093" y="482" font-size="21" font-weight="700">H2</text>
      <text x="680" y="509" font-size="16" fill="#667080">interface</text>
      <text x="830" y="509" font-size="16" fill="#667080">Java API</text>
      <text x="1093" y="509" font-size="16" fill="#667080">persistence</text>
    </g>
    <g fill="none" stroke="#D98268" stroke-width="2.5" marker-end="url(#arrow-coral)">
      <line x1="755" y1="487" x2="802" y2="487"/>
      <line x1="1025" y1="487" x2="1064" y2="487"/>
    </g>

    <!-- Professional destination -->
    <rect x="1240" y="32" width="328" height="536" rx="20" fill="#1E2A3A"/>
    <g font-family="Inter, Arial, sans-serif">
      <text x="1280" y="78" font-size="17" font-weight="750" letter-spacing="2.4" fill="#F4C0AE">PROFESSIONAL DIRECTION</text>
      <text x="1280" y="142" font-size="35" font-weight="780" fill="#FFFDF9">FULL-STACK</text>
      <text x="1280" y="184" font-size="35" font-weight="780" fill="#FFFDF9">+ BACKEND</text>

      <line x1="1280" y1="222" x2="1528" y2="222" stroke="#4A5668" stroke-width="2"/>

      <text x="1280" y="270" font-size="18" font-weight="700" letter-spacing="1.8" fill="#D7E8DC">CURRENTLY OPEN TO</text>
      <text x="1280" y="312" font-size="27" font-weight="760" fill="#FFFDF9">SOFTWARE</text>
      <text x="1280" y="347" font-size="27" font-weight="760" fill="#FFFDF9">ENGINEERING</text>
      <text x="1280" y="382" font-size="27" font-weight="760" fill="#FFFDF9">INTERNSHIPS</text>

      <rect x="1280" y="426" width="248" height="85" rx="14" fill="#2A3749" stroke="#4A5668" stroke-width="2"/>
      <text x="1302" y="459" font-size="16" font-weight="700" letter-spacing="1.5" fill="#F4C0AE">ENGINEERING GOAL</text>
      <text x="1302" y="489" font-size="19" font-weight="650" fill="#FFFDF9">Build reliable, useful</text>
      <text x="1302" y="513" font-size="19" font-weight="650" fill="#FFFDF9">digital products.</text>

      <circle cx="1290" cy="545" r="5" fill="#D98268"/>
      <text x="1305" y="551" font-size="16" font-weight="650" fill="#D7E8DC">AVAILABLE TO CONNECT</text>
    </g>

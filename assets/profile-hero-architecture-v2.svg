<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Pushmitha Vigneswaran personal engineering system map</title>
  <desc id="desc">A warm editorial architecture map connecting Pushmitha's Information Technology degree at the University of Moratuwa to three real projects: Fixflow, a Next.js portfolio, and a React plus Spring Boot e-commerce application, ending with an open-to-internships destination.</desc>

  <defs>
    <marker id="arrow-lavender" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#6C63B8"/>
    </marker>
    <marker id="arrow-sage" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#4E7D66"/>
    </marker>
    <marker id="arrow-coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#D98268"/>
    </marker>
    <clipPath id="frame">
      <rect x="2" y="2" width="1596" height="596" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="600" fill="#FBF8F2"/>

    <!-- Personal origin -->
    <rect x="32" y="32" width="334" height="536" rx="20" fill="#FFFDF9" stroke="#DED8CE" stroke-width="2"/>
    <rect x="32" y="32" width="10" height="536" rx="5" fill="#6C63B8"/>

    <g transform="translate(72 72)">
      <rect width="74" height="74" rx="18" fill="#1E2A3A"/>
      <text x="37" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#FFFDF9">PV</text>
      <circle cx="62" cy="12" r="5" fill="#F4C0AE"/>
    </g>

    <g font-family="Inter, Arial, sans-serif" fill="#1E2A3A">
      <text x="72" y="190" font-size="35" font-weight="760">PUSHMITHA</text>
      <text x="72" y="230" font-size="35" font-weight="760">VIGNESWARAN</text>
      <text x="72" y="272" font-size="20" font-weight="650" fill="#6C63B8" letter-spacing="1.5">INFORMATION</text>
      <text x="72" y="300" font-size="20" font-weight="650" fill="#6C63B8" letter-spacing="1.5">TECHNOLOGY</text>

      <text x="72" y="344" font-size="25" font-weight="700">BSc (Hons)</text>
      <text x="72" y="376" font-size="22" fill="#667080">University of Moratuwa</text>

      <line x1="72" y1="410" x2="326" y2="410" stroke="#DED8CE" stroke-width="2"/>

      <text x="72" y="447" font-size="18" font-weight="700" fill="#667080" letter-spacing="2">ENGINEERING FOCUS</text>
      <rect x="72" y="466" width="116" height="37" rx="18.5" fill="#DDD8FF"/>
      <text x="130" y="491" text-anchor="middle" font-size="18" font-weight="700" fill="#514A98">FULL-STACK</text>
      <rect x="198" y="466" width="112" height="37" rx="18.5" fill="#D7E8DC"/>
      <text x="254" y="491" text-anchor="middle" font-size="18" font-weight="700" fill="#3F6A56">BACKEND</text>
      <text x="72" y="538" font-size="18" fill="#667080">Colombo, Sri Lanka</text>
    </g>

    <!-- Central engineering map -->
    <rect x="390" y="32" width="826" height="536" rx="20" fill="#FFFDF9" stroke="#DED8CE" stroke-width="2"/>

    <g font-family="Inter, Arial, sans-serif">
      <text x="426" y="76" font-size="18" font-weight="750" letter-spacing="2.5" fill="#667080">PERSONAL ENGINEERING SYSTEM</text>
      <text x="426" y="108" font-size="25" font-weight="720" fill="#1E2A3A">Three projects. One interface-to-infrastructure practice.</text>
    </g>

    <!-- Capability layer headings -->
    <g font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.2" fill="#667080">
      <text x="578" y="142" text-anchor="middle">INTERFACE</text>
      <text x="754" y="142" text-anchor="middle">APIs + SERVICES</text>
      <text x="958" y="142" text-anchor="middle">MESSAGING + DATA</text>
      <text x="1133" y="142" text-anchor="middle">TEST + DELIVERY</text>
    </g>
    <line x1="426" y1="154" x2="1180" y2="154" stroke="#DED8CE" stroke-width="2"/>
    <line x1="650" y1="132" x2="650" y2="536" stroke="#EEE9E1" stroke-width="2"/>
    <line x1="857" y1="132" x2="857" y2="536" stroke="#EEE9E1" stroke-width="2"/>
    <line x1="1058" y1="132" x2="1058" y2="536" stroke="#EEE9E1" stroke-width="2"/>


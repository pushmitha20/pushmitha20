    <rect x="414" y="170" width="9" height="154" rx="4.5" fill="#6C63B8"/>
    <g font-family="Inter, Arial, sans-serif">
      <text x="448" y="207" font-size="28" font-weight="780" fill="#1E2A3A">FIXFLOW</text>
      <text x="448" y="234" font-size="17" font-weight="600" fill="#667080">maintenance operations · service architecture</text>
    </g>

    <!-- Fixflow nodes and icons -->
    <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E2A3A">
      <g transform="translate(540 258)">
        <rect x="-48" y="-18" width="96" height="46" rx="9" fill="#FFFDF9" stroke="#6C63B8" stroke-width="2"/>
        <rect x="-35" y="-7" width="70" height="22" rx="3" fill="none" stroke="#6C63B8" stroke-width="2"/>
        <line x1="-14" y1="21" x2="14" y2="21" stroke="#6C63B8" stroke-width="2"/>
        <text x="0" y="52" text-anchor="middle">React / TS</text>
      </g>
      <g transform="translate(704 258)">
        <polygon points="0,-20 42,5 0,30 -42,5" fill="#FFFDF9" stroke="#6C63B8" stroke-width="2"/>
        <path d="M-15 5H15M7-3L15 5L7 13" fill="none" stroke="#6C63B8" stroke-width="2"/>
        <text x="0" y="52" text-anchor="middle">API Gateway</text>
      </g>
      <g transform="translate(858 258)">
        <rect x="-58" y="-22" width="52" height="34" rx="7" fill="#FFFDF9" stroke="#6C63B8" stroke-width="2"/>
        <rect x="6" y="-8" width="52" height="34" rx="7" fill="#FFFDF9" stroke="#6C63B8" stroke-width="2"/>
        <circle cx="-43" cy="-5" r="3" fill="#D98268"/>
        <circle cx="21" cy="9" r="3" fill="#4E7D66"/>
        <text x="0" y="52" text-anchor="middle">Python / .NET</text>
      </g>
      <g transform="translate(1015 258)">
        <rect x="-58" y="-18" width="50" height="9" rx="4.5" fill="#6C63B8"/>
        <rect x="-58" y="-3" width="50" height="9" rx="4.5" fill="#8C85CF"/>
        <rect x="-58" y="12" width="50" height="9" rx="4.5" fill="#ACA7DF"/>
        <ellipse cx="35" cy="-11" rx="27" ry="10" fill="#FFFDF9" stroke="#6C63B8" stroke-width="2"/>
        <path d="M8-11V18C8 24 20 28 35 28S62 24 62 18V-11" fill="#FFFDF9" stroke="#6C63B8" stroke-width="2"/>
        <text x="0" y="52" text-anchor="middle">Kafka + SQL</text>
      </g>
      <g transform="translate(1134 258)">
        <circle cx="0" cy="3" r="27" fill="#FFFDF9" stroke="#6C63B8" stroke-width="2"/>
        <path d="M-13 3L-3 13L15-9" fill="none" stroke="#4E7D66" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="0" y="52" text-anchor="middle">Tests</text>
      </g>
    </g>

    <g fill="none" stroke="#6C63B8" stroke-width="2.5" marker-end="url(#arrow-lavender)">
